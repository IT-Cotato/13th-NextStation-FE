name: Discord Alert

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            curl -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg content "PR 알림\n제목: ${{ github.event.pull_request.title }}\n작성자: ${{ github.event.pull_request.user.login }}\n링크: ${{ github.event.pull_request.html_url }}" \
                '{content: $content}')" \
              "$DISCORD_WEBHOOK"
          else
            curl -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg content "Push 알림\n브랜치: ${{ github.ref_name }}\n커밋: ${{ github.event.head_commit.message }}\n링크: https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
                '{content: $content}')" \
              "$DISCORD_WEBHOOK"
          fi
